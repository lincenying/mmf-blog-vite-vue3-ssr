services:
  mongo:
    container_name: db-mongo-vue3-ssr
    image: mongo:4.0
    volumes:
      - ${MONGO_DIR:-./data/mongodb}:/data/db
    ports:
      - 27017:27017
    networks:
      - webnet

  api:
    container_name: api-express-vue3-ssr
    image: lincenying/api-express:${API_TAG}
    environment:
      DATABASE_URL: mongodb://mongo:27017
    ports:
      - 4008:4000
    depends_on:
      - mongo
    networks:
      - webnet

  app:
    container_name: app-vue3-ssr
    image: lincenying/app-vue3-ssr:${TAG}
    environment:
      API_URL: http://api:4000
    env_file:
      - .env
    build:
      context: .
      dockerfile: ./Dockerfile
    depends_on:
      - api
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - 7777:7777
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
