# 控制是否以及如何将依赖项添加到默认目录中
catalogMode: prefer

# 是否忽略向工作区根目录添加依赖时的警告提示
ignoreWorkspaceRootCheck: true

# npm 包注册表的基本 URL（包括尾部斜杠）
registry: https://registry.npmmirror.com/
registries:
  default: https://registry.npmmirror.com/

# 定义了版本发布后 pnpm 安装之前必须经过的最少分钟数
minimumReleaseAge: 0

# 是否强制提升所有依赖
shamefullyHoist: true

# 在执行脚本时使用POSIX shell模拟器替代系统原生shell
shellEmulator: true

# 用于控制是否严格检查对等依赖（peer dependencies）的版本一致性。
# 当设置为 true 时，pnpm 会强制安装指定版本的对等依赖；
# 设置为 false 时，会忽略版本不一致的警告
strictPeerDependencies: false

# 当设置为“禁止降级”时，如果软件包的信任级别较之前的版本有所降低，pnpm 将无法安装
trustPolicy: no-downgrade

# 列出一个或多个 pnpm 应该允许安装的特定软件包或版本，即使这些软件包不满足信任策略要求。
trustPolicyExclude:
  - semver
  - chokidar
  - cached-factory
  - mermaid
  - '@oxc-resolver/binding-win32-x64-msvc'
  - '@oxc-resolver/binding-win32-arm64-msvc'
  - '@oxc-resolver/binding-linux-x64-gnu'
  - '@oxc-resolver/binding-linux-arm64-gnu'
  - '@oxc-resolver/binding-darwin-x64'
  - '@oxc-resolver/binding-darwin-arm64'
  - '@trickfilm400/rollup-plugin-off-main-thread'

packages:
  - packages/*

catalogs:
  dev:
    '@lincy/unocss-base-config': ^3.0.0
    '@vitejs/plugin-vue': ^6.0.9
    '@vitejs/plugin-vue-jsx': ^5.1.6
    '@vue/compiler-sfc': ^3.5.43
    bumpp: ^12.3.0
    cross-env: ^10.1.0
    mockjs: ^1.1.0
    nodemon: ^3.1.14
    polyfill-library: ^4.8.0
    postcss: ^8.5.28
    sass-embedded: ^1.105.1
    tsup: ^8.5.1
    tsx: ^4.23.15
    typescript: ^7.0.2
    unocss: ^66.10.5
    unplugin-auto-import: ^21.1.0
    unplugin-vue-components: ^32.1.0
    vite: ^8.3.1
    vite-plugin-mock: ^3.0.2
    vite-plugin-pwa: ^1.3.0
    vue-tsc: ^3.3.11

  icons:
    '@iconify-json/mdi': ^1.2.3

  lint:
    '@lincy/eslint-config': ^8.0.1
    '@lincy/stylelint-config': ^2.3.0
    '@unocss/eslint-plugin': ^66.10.5
    eslint: ^10.11.0
    eslint-plugin-format: ^2.0.1
    stylelint: ^17.15.0

  node:
    compression: ^1.8.2
    cookie-parser: ^1.4.7
    express: ^5.2.1
    express-rate-limit: ^8.7.0
    http-proxy-middleware: ^4.2.0
    lru-cache: ^11.5.3
    morgan: ^1.12.1
    request-ip: ^3.3.0
    serve-static: ^2.2.1

  prod:
    '@kangc/v-md-editor': ^2.3.18
    '@lincy/utils': ^0.7.3
    '@unhead/ssr': ^3.4.1
    '@unhead/vue': ^3.4.2
    '@vue/server-renderer': ^3.5.43
    '@vueuse/core': ^15.0.0
    axios: ^1.20.0
    element-plus: ^2.14.6
    js-cookie: ^3.0.8
    md5: ^2.3.0
    pinia: ^4.0.3
    prismjs: ^1.30.0
    qs: ^6.16.0
    vue: ^3.5.43
    vue-content-loader: ^2.0.1
    vue-loading-overlay: ^6.0.6
    vue-router: ^5.3.1

  types:
    '@types/compression': ^1.8.1
    '@types/cookie-parser': ^1.4.10
    '@types/express': ^5.0.6
    '@types/js-cookie': ^3.0.6
    '@types/md5': ^2.3.6
    '@types/morgan': ^1.9.10
    '@types/polyfill-library': ^3.108.4
    '@types/prismjs': ^1.26.6
    '@types/request-ip': ^0.0.41
    '@types/serve-static': ^2.2.0

peerDependencyRules:
  ignoreMissing:
    - rollup
    - esbuild
    - postcss
    - prettier

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  simple-git-hooks: false
